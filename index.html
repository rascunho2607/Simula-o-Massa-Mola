<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulação de Tecido - Massa-Mola com Sistema de Upgrades</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    
<body>
    <div class="info">
        Arraste para interagir | Botão direito para rasgar (ou arraste rápido)
    </div>    
    <!-- Informações do jogador -->
    <div class="player-info" id="playerInfo">
        <div class="level-display">
            <div class="level-label">Nível</div>
            <div class="level-value" id="playerLevel">1</div>
        </div>
        <div class="xp-bar">
            <div class="xp-fill" id="xpFill" style="width: 0%"></div>
            <div class="xp-text" id="xpText">0/100</div>
        </div>
        <div class="points-display" id="upgradePoints">
            ⭐ 0
        </div>
    </div>
    
    <!-- Indicador de ferramenta ativa -->
    <div class="tool-indicator" id="toolIndicator">
        Ferramenta: Mouse (Arraste)
    </div>
    
    <!-- Contador de dardos fixos -->
    <div class="dart-counter" id="dartCounter">
        Dardos Fixos: 0
    </div>
    
    <!-- Botão para apagar fogo -->
    <div class="left-quick-actions">
        <button class="extinguish-btn" id="extinguishBtn" title="Apagar todo o fogo">
            Apagar Fogo (F)
        </button>
        <button class="clear-darts-btn" id="clearDartsBtn" title="Remover todos os dardos">
            Remover Dardos (R)
        </button>
        <button class="regenerate-cloth-btn" id="regenerateClothBtn" title="Regenerar tecido">
            &#128260; Regenerar Tecido
        </button>
    </div>
    
    <div class="right-actions">
        <!-- Botão de configurações -->
        <button class="config-btn" id="configBtn" title="Configurações" aria-label="Configurações">
            ⚙️
        </button>
        
        <!-- Botão de upgrades -->
        <button class="upgrade-btn" id="upgradeBtn" title="Upgrades" aria-label="Upgrades">
            ⚡
        </button>
        
        <!-- Botão de habilidades especiais -->
        <button class="special-btn" id="specialBtn" title="Habilidades Especiais" aria-label="Habilidades Especiais">
            ★
        </button>

        <!-- Botão para remover dardos -->
    </div>
    
    <!-- Barra lateral de habilidades -->
    <div class="abilities-bar" id="abilitiesBar">
        <!-- Habilidades serão adicionadas dinamicamente -->
    </div>
    
    <!-- Modal de configurações -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Configurações da Simulação</div>
                <button class="close-btn" id="closeConfigModal">&times;</button>
            </div>
            
            <div id="configControls">
                <!-- Controles serão gerados dinamicamente pelo JavaScript -->
            </div>
            
            <div class="modal-footer">
                <button class="reset-btn" id="resetBtn">Redefinir para valores padrão</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de upgrades gerais -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Sistema de Upgrades</div>
                <button class="close-btn" id="closeUpgradeModal">&times;</button>
            </div>
            
            <div class="tabs" id="upgradeTabs">
                <!-- Tabs serão geradas dinamicamente -->
            </div>
            
            <div id="upgradeContent">
                <!-- Conteúdo dos upgrades será gerado dinamicamente -->
            </div>
        </div>
    </div>
    
    <!-- Modal de habilidades especiais -->
    <div class="modal" id="specialModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Habilidades Especiais</div>
                <button class="close-btn" id="closeSpecialModal">&times;</button>
            </div>
            
            <div class="tabs" id="specialTabs">
                <!-- Tabs serão geradas dinamicamente -->
            </div>
            
            <div id="specialContent">
                <!-- Conteúdo das habilidades será gerado dinamicamente -->
            </div>
        </div>
    </div>
    
    <!-- Barra de ferramentas em leque -->
    <div class="toolbar" id="toolbar">
        <!-- Ferramentas serão adicionadas dinamicamente -->
    </div>
    
    <canvas id="canvas"></canvas>
    <script type="module" src="js/main.js"></script>
</body>
</html>
